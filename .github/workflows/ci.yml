name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build --tag ravache-docker:${{ github.sha }} .

  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Report missing deploy hook
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "Add the RENDER_DEPLOY_HOOK repository secret to enable Render deployments."
